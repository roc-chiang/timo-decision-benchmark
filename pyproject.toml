[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timo-decision-benchmark"
version = "1.0.0"
description = "A production benchmark evaluating fiduciary consumer decision models against commercial sales bias."
readme = "README.md"
authors = [
  { name = "TimoBuy Research Team", email = "research@timobuy.com" }
]
license = { text = "MIT" }
keywords = [
  "decision-models",
  "ai-agents",
  "benchmarking",
  "llm-evals",
  "fiduciary-ai",
  "shopping-copilot"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.1.0"
]

[project.urls]
"Homepage" = "https://timobuy.com"
"Repository" = "https://github.com/roc-chiang/timo-decision-benchmark"
"Issue Tracker" = "https://github.com/roc-chiang/timo-decision-benchmark/issues"
